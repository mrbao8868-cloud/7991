    <script>
      // This script runs after auto-render.js is supposed to have loaded.
      // It first VERIFIES that the render function exists before signaling readiness.
      // This prevents errors if the auto-render script fails to load from the CDN.
      if (typeof renderMathInElement === 'function') {
        window.KATE_IS_READY = true;
        document.dispatchEvent(new CustomEvent('katex-ready'));
      } else {
        console.error("KaTeX auto-render script failed to load or did not define 'renderMathInElement'. Math formulas will not be rendered.");
      }
    </script>

    <style>
      body {
        font-family: 'Be Vietnam Pro', sans-serif;
      }
      /* Marquee Animation */
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        position: relative;
      }
      .animate-marquee {
        display: inline-block;
        padding-left: 100%; /* Start off-screen right */
        animation: marquee 25s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }
      
      @media print {
        @page {
          size: A4 portrait;
          margin: 2cm;
        }
        body * {
          visibility: hidden;
        }
        #printable-area, #printable-area * {
          visibility: visible;
        }
        #printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        .no-print {
          display: none;
        }
        .break-before-page {
          page-break-before: always;
        }
        .break-inside-avoid {
          page-break-inside: avoid;
        }
      }
    </style>
